<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#d6336c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Dompet AYU</title>

  <style>
    :root {
      color-scheme: light dark;
      --brand: #d6336c;
      --brand-dark: #a61e4d;
      --gold: #d4a017;
      --surface: #fff7fa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--surface);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: var(--surface);
      opacity: 0;
      transition: opacity 220ms ease;
    }

    #appFrame.ready {
      opacity: 1;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 75% 20%, rgba(212, 160, 23, .22), transparent 32%),
        linear-gradient(145deg, var(--brand-dark), var(--brand) 58%, var(--gold));
      color: #fff;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, .18);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .18);
      backdrop-filter: blur(12px);
      font-size: 38px;
      animation: float 1.7s ease-in-out infinite alternate;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.4px;
    }

    p {
      margin: 8px 0 0;
      font-size: 13px;
      opacity: .88;
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 24px auto 0;
      border: 3px solid rgba(255, 255, 255, .28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    #fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 28px;
      background: #fff7fa;
      color: #333;
      text-align: center;
    }

    #fallback.visible {
      display: grid;
    }

    #fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      to { transform: translateY(-7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="splash" aria-live="polite">
    <div class="splash-content">
      <div class="logo" aria-hidden="true">👛</div>
      <h1>Dompet AYU</h1>
      <p>Smart Family Finance</p>
      <div class="loader" aria-label="Memuat aplikasi"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    title="Dompet AYU"
    src="https://script.google.com/macros/s/AKfycbwLBg4CaoltoZeKNcs1X1qxMI7itFp3bSK55r8vdrVtc_4-0CeDtGWEUGU1YtiBHXGS/exec"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="fallback">
    <div>
      <h2>Aplikasi belum dapat dimuat</h2>
      <p>Periksa koneksi internet, lalu muat ulang halaman.</p>
      <a href="https://script.google.com/macros/s/AKfycbwLBg4CaoltoZeKNcs1X1qxMI7itFp3bSK55r8vdrVtc_4-0CeDtGWEUGU1YtiBHXGS/exec">Buka aplikasi</a>
    </div>
  </div>

  <script>
    (() => {
      const GAS_URL = "https://script.google.com/macros/s/AKfycbwLBg4CaoltoZeKNcs1X1qxMI7itFp3bSK55r8vdrVtc_4-0CeDtGWEUGU1YtiBHXGS/exec";
      const frame = document.getElementById("appFrame");
      const splash = document.getElementById("splash");
      const fallback = document.getElementById("fallback");

      // Teruskan query string/hash GitHub ke aplikasi GAS bila ada.
      const suffix = window.location.search + window.location.hash;
      if (suffix) {
        frame.src = GAS_URL + suffix;
      }

      let loaded = false;

      frame.addEventListener("load", () => {
        loaded = true;
        frame.classList.add("ready");
        splash.classList.add("hidden");
      });

      // Tampilkan pesan bantuan hanya jika iframe belum memberi event load.
      window.setTimeout(() => {
        if (!loaded) {
          splash.classList.add("hidden");
          fallback.classList.add("visible");
        }
      }, 15000);

      // Mencegah gesture overscroll pada shell GitHub.
      document.addEventListener(
        "touchmove",
        event => {
          if (event.target === document.body) event.preventDefault();
        },
        { passive: false }
      );
    })();
  </script>
</body>
</html>
